name: Deploy Shiny forecast app to Pages

on:
  push:
    branches: [main]
    paths:
      - "shiny/**"
      - ".github/workflows/deploy-shiny-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::leaflet
            any::dplyr

      - name: Get shinylive asset cache dir
        id: shinylive-cache-dir
        run: |
          echo "dir=$(Rscript -e 'cat(tools::R_user_dir("shinylive", "cache"))')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.shinylive-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-shinylive-assets-v1
          restore-keys: |
            ${{ runner.os }}-shinylive-assets-

      - name: Build shinylive site
        run: Rscript shiny/build_site.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: shiny/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
